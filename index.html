<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thinking Time Bomb</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-phase="focus" data-mode="light">
  <header class="topbar">
    <a class="logo" href="./" aria-label="Thinking Time Bomb, home">
      <img class="logo-icon logo-light" src="assets/icon.svg" width="28" height="35" alt="">
      <img class="logo-icon logo-dark" src="assets/icon-dark.svg" width="28" height="35" alt="">
      <span class="word"><span>Thinking Time</span><span class="dot"></span><span class="accent">Bomb</span></span>
    </a>
    <button id="open-settings" class="icon-btn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <main class="stage">
    <p id="phase-name" class="phase-name">Focus</p>
    <div id="cycle-dots" class="cycle-dots" role="img"></div>

    <div id="bomb-wrap" class="bomb-wrap">
      <svg class="bomb" viewBox="0 0 48 60" aria-hidden="true">
        <path class="fuse-track" d="M24 17 Q24 8 32 7"/>
        <path id="fuse" class="fuse" d="M24 17 Q24 8 32 7"/>
        <g id="spark" class="spark">
          <g class="spark-inner">
            <polygon points="0,-5 2,0 0,5 -2,0"/>
            <polygon points="-5,0 0,-2 5,0 0,2"/>
          </g>
        </g>
        <rect class="bomb-top" x="18.5" y="15" width="11" height="7" rx="1.5"/>
        <circle class="face" cx="24" cy="38" r="17"/>
        <path id="wedge" class="wedge"/>
        <rect id="hand" class="hand" x="22" y="27" width="4" height="12.5" rx="2"/>
        <circle class="pin" cx="24" cy="38" r="3"/>
      </svg>
      <div class="burst" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
    </div>

    <p id="time" class="time" role="timer">25:00</p>

    <div class="controls">
      <button id="start-pause" class="btn-primary" type="button">Light the fuse</button>
      <div class="secondary">
        <button id="reset" class="btn-ghost" type="button">Re-arm</button>
        <button id="skip" class="btn-ghost" type="button">Defuse</button>
      </div>
    </div>

    <p id="status" class="status" role="status"></p>
  </main>

  <footer class="shortcuts">
    <kbd>Space</kbd> start / hold · <kbd>R</kbd> re-arm · <kbd>S</kbd> skip
  </footer>

  <dialog id="settings" class="drawer" aria-labelledby="settings-title">
    <form id="settings-form" novalidate>
      <div class="drawer-head">
        <h2 id="settings-title" tabindex="-1" autofocus>Settings</h2>
        <button id="close-settings" class="icon-btn" type="button" aria-label="Close settings">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <fieldset>
        <legend>Timer</legend>
        <div class="field">
          <label for="focusMin">Focus</label>
          <div class="stepper"><input id="focusMin" name="focusMin" inputmode="numeric" autocomplete="off"><span class="unit">min</span></div>
        </div>
        <div class="field">
          <label for="shortBreakMin">Short break</label>
          <div class="stepper"><input id="shortBreakMin" name="shortBreakMin" inputmode="numeric" autocomplete="off"><span class="unit">min</span></div>
        </div>
        <div class="field">
          <label for="longBreakMin">Long break</label>
          <div class="stepper"><input id="longBreakMin" name="longBreakMin" inputmode="numeric" autocomplete="off"><span class="unit">min</span></div>
        </div>
        <div class="field">
          <label for="longBreakEvery">Long break after</label>
          <div class="stepper"><input id="longBreakEvery" name="longBreakEvery" inputmode="numeric" autocomplete="off"><span class="unit">sessions</span></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Flow</legend>
        <label class="field">Auto-start breaks
          <input name="autoStartBreaks" type="checkbox" role="switch" class="switch">
        </label>
        <label class="field">Auto-start next focus
          <input name="autoStartFocus" type="checkbox" role="switch" class="switch">
        </label>
      </fieldset>

      <fieldset>
        <legend>Sound</legend>
        <div class="segmented">
          <label><input type="radio" name="sound" value="chime"><span>Chime</span></label>
          <label><input type="radio" name="sound" value="bell"><span>Bell</span></label>
          <label><input type="radio" name="sound" value="off"><span>Off</span></label>
        </div>
        <label class="field">Volume
          <input name="volume" type="range" min="0" max="100" step="5">
        </label>
        <button id="test-sound" class="btn-ghost" type="button">Test sound</button>
      </fieldset>

      <fieldset>
        <legend>Appearance</legend>
        <div class="segmented">
          <label><input type="radio" name="theme" value="system"><span>System</span></label>
          <label><input type="radio" name="theme" value="light"><span>Light</span></label>
          <label><input type="radio" name="theme" value="dark"><span>Dark</span></label>
        </div>
        <p class="hint">Breaks always get the dark cool-down screen.</p>
      </fieldset>

      <ul id="settings-errors" class="errors" role="alert"></ul>

      <div class="drawer-actions">
        <button id="cancel-settings" class="btn-ghost" type="button">Cancel</button>
        <button class="btn-primary" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
